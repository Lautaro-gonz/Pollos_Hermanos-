<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ingresar — Panel Los Pollos Hermanos</title>
  <meta name="theme-color" content="#fdfbf7">
  <link rel="icon" href="../assets/logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">

  <main class="login-wrap">
    <div class="login-card fade-up">
      <div class="login-brand">
        <img src="../assets/logo.jpeg" alt="" width="76" height="76">
        <span class="eyebrow">Panel de administración</span>
        <h1>¡Hola de nuevo!</h1>
        <p class="text-soft">Ingresá para gestionar el menú.</p>
      </div>

      <div class="alert alert--info" id="login-config" hidden>
        Falta configurar Supabase en <strong>js/config.js</strong> (URL y anon key).
      </div>

      <form class="login-form" id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" inputmode="email" required autofocus>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" id="password-toggle" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="alert alert--error" id="login-error" role="alert" hidden></div>

        <button class="btn btn-primary btn-block" type="submit" id="login-submit">Ingresar</button>
      </form>

      <a class="login-back" href="../index.html">← Volver a la tienda</a>
    </div>
  </main>

  <script type="module" src="../js/admin/login.js"></script>
</body>
</html>
